[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia-interest"
version = "0.1.0"
description = "Wikipedia interest analysis skill"
readme = "../README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = []
keywords = ["wikipedia", "pageviews", "analytics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
    "numpy>=1.20.0",
    "matplotlib>=3.0.0",
    "fpdf2>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
wikitrends = "wikitrends.cli:main"

[tool.pytest.ini_options]
markers = [
    "live: mark test as live test (excluded by default)",
]
addopts = ["-m", "not live"]